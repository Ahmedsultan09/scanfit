name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run verify
      - id: release
        name: Validate release metadata
        env:
          SCANFIT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-metadata.mjs
      - name: Publish package
        run: npm publish --workspace @scanfit/browser --access public --tag "${{ steps.release.outputs.distribution_tag }}"
