name: Bug report
description: Report reproducible behavior that differs from ScanFit's documented contract.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or fully redacted inputs. For a security or privacy vulnerability, use the private reporting process instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a repository, StackBlitz link or exact steps using synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScanFit version or commit
      placeholder: 9afcbbe or 0.1.0-alpha.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and device
      placeholder: Safari 26.0, iOS 26, iPhone SE 2
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input and export settings
      description: Include formats, page count, approximate source dimensions, maxBytes, page size and quality floors when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Errors or diagnostics
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not attached personal, confidential or unlicensed document content.
          required: true
        - label: This report does not disclose a security vulnerability publicly.
          required: true
